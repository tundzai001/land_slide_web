<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin — Slide 3D Landslide Simulation</title>
    <meta name="description"
        content="Mô phỏng sạt lở đất 3D thời gian thực dựa trên mô hình Slide model. Digital Twin cho hệ thống cảnh báo sớm.">

    <!-- Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="/css/digital-twin.css?v=20260429-v1">
</head>

<body>
    <!-- ==================== TOP BAR ==================== -->
    <header id="dt-header">
        <div class="dt-header-left">
            <a href="/" class="dt-logo">
                <div class="dt-logo-icon"><i class="bi bi-tsunami"></i></div>
                <span class="dt-logo-text">Slide Digital Twin</span>
            </a>
            <div class="dt-status-badge" id="sim-status-badge">
                <span class="dt-status-dot"></span>
                <span class="dt-status-text">STABLE</span>
            </div>
        </div>
        <div class="dt-header-center">
            <div class="dt-fos-mini" id="fos-mini-display">
                <span class="dt-fos-label">FoS</span>
                <span class="dt-fos-value" id="fos-value-header">2.45</span>
            </div>
        </div>
        <div class="dt-header-right">
            <button class="dt-btn-icon" id="btn-toggle-panel" title="Toggle Panel">
                <i class="bi bi-layout-sidebar"></i>
            </button>
            <button class="dt-btn-icon" id="btn-fullscreen" title="Fullscreen">
                <i class="bi bi-arrows-fullscreen"></i>
            </button>
            <a href="/pages/map.html" class="dt-btn-back">
                <i class="bi bi-arrow-left"></i> Bản đồ
            </a>
        </div>
    </header>

    <!-- Panel + Viewport loaded from shared partial -->
    <div id="dt-panel-placeholder"></div>
    <script>
        fetch('/pages/partials/dt-panel.html').then(r => r.text()).then(html => {
            document.getElementById('dt-panel-placeholder').outerHTML = html;
        });
    </script>

    <!-- ==================== SCRIPTS ==================== -->
    <script type="module" src="/js/engine/simulation-controller.js?v=20260429-v2"></script>
</body>

</html>
