name: Quality and release package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            field_unit/requirements-industrial.txt
      - name: Install test dependencies
        run: 'python -m pip install --only-binary :all: --no-binary wait-for2 -r backend/requirements.txt -r field_unit/requirements-industrial.txt pytest==9.2.0 pytest-cov==7.1.0 httpx==0.28.1'
      - name: Test backend and industrial gateway
        env:
          PYTHONPATH: backend
          ENVIRONMENT: production
          SECRET_KEY: ci-only-signing-key-never-use-in-production
          AUTH_DB_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci_auth
          CONFIG_DB_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci_config
          DATA_DB_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci_data
        run: python -m pytest backend/tests -q --disable-warnings --tb=short --show-capture=no --cov=backend/app --cov=backend/processors --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    env:
      FRONTEND_COVERAGE_DIR: output/frontend-coverage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build production frontend
        run: npm run build:frontend
      - name: Check committed assets match source
        run: git diff --exit-code -- frontend/dist
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test map, navigation, and theme interactions
        run: >-
          npx --no-install playwright test
          tests/ui/map-heatmap.spec.js
          tests/ui/theme-toggle-motion.spec.js
          tests/ui/theme-contract.spec.js
          tests/ui/analysis-safety.spec.js
          tests/ui/auto-adjustment.spec.js
          tests/ui/gnss-summary-theme.spec.js
          tests/ui/gnss-terminal.spec.js
          tests/ui/map-workspace-tools.spec.js
          tests/ui/project-map-overview.spec.js
          tests/ui/project-dem-dashboard.spec.js
          tests/ui/rescue-navigation.spec.js
          tests/ui/provisioning-safety.spec.js
          tests/ui/login-premium.spec.js
          tests/ui/landing-premium.spec.js
          --project=chromium --reporter=line
      - name: Test login route normalization
        run: npx --no-install playwright test tests/ui/auth-session.spec.js --project=chromium --reporter=line -g "browser session opens"
      - name: Test database explorer and export input safety
        run: npx --no-install playwright test tests/ui/management-operations.spec.js --project=chromium --reporter=line -g "database explorer loads one paginated|database explorer prefetches|database export rejects unsafe"
      - name: Generate frontend coverage
        run: node scripts/write-frontend-coverage.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage
          path: coverage-js/lcov.info

  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: backend-coverage
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: frontend-coverage
          path: coverage-js
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=tundzai001
            -Dsonar.projectKey=tundzai001_land_slide_web
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.javascript.lcov.reportPaths=coverage-js/lcov.info
            -Dsonar.sources=.
            -Dsonar.tests=backend/tests,tests
            -Dsonar.exclusions=coverage.xml,coverage-js/**,backend/tests/**,tests/**,frontend/dist/**
            -Dsonar.coverage.exclusions=field_unit/**,scripts/**,frontend/**,backend/*,backend/alembic/**,backend/static/**,backend/app/features/field/**,backend/app/mqtt/ntrip_pusher.py,**/*.html,**/*.config,**/*.mjs,**/*.cjs,**/*.yml,.github/**
            -Dsonar.issue.ignore.multicriteria=e1,e2
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8544
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
            -Dsonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S8476
            -Dsonar.issue.ignore.multicriteria.e2.resourceKey=frontend/js/db-manager.js
            -Dsonar.qualitygate.wait=true
      - name: Report Quality Gate details
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "=== Quality Gate Project Status ==="
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=tundzai001_land_slide_web" || true
          echo ""
          echo "=== Open Vulnerabilities on New Code ==="
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=tundzai001_land_slide_web&sinceLeakPeriod=true&types=VULNERABILITY" || true

  release-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, sonar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package verified source and assets
        run: >-
          git archive --format=tar.gz --output=monitoring-release.tar.gz HEAD
          frontend/dist backend/app backend/alembic backend/alembic.ini
          backend/processors backend/static backend/requirements.txt
          backend/server.py backend/security_core.py field_unit web.config
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: monitoring-release-${{ github.sha }}
          path: monitoring-release.tar.gz
          retention-days: 14
