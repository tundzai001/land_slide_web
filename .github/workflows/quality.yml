name: Quality and release package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            field_unit/requirements-industrial.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt -r field_unit/requirements-industrial.txt pytest pytest-cov httpx
      - name: Test backend and industrial gateway
        env:
          PYTHONPATH: backend
          ENVIRONMENT: production
          SECRET_KEY: ci-only-signing-key-never-use-in-production
          AUTH_DB_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci_auth
          CONFIG_DB_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci_config
          DATA_DB_URL: postgresql+asyncpg://ci:ci@127.0.0.1:1/ci_data
        run: python -m pytest backend/tests -q --disable-warnings --tb=short --show-capture=no --cov=backend/app --cov=field_unit --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production frontend
        run: npm run build:frontend
      - name: Check committed assets match source
        run: git diff --exit-code -- frontend/dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test map, navigation, and theme interactions
        run: >-
          npx playwright test
          tests/ui/map-heatmap.spec.js
          tests/ui/theme-toggle-motion.spec.js
          tests/ui/theme-contract.spec.js
          tests/ui/map-workspace-tools.spec.js
          tests/ui/project-map-overview.spec.js
          tests/ui/project-dem-dashboard.spec.js
          tests/ui/rescue-navigation.spec.js
          tests/ui/provisioning-safety.spec.js
          tests/ui/login-premium.spec.js
          --project=chromium --reporter=line

  sonar:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=tundzai001
            -Dsonar.projectKey=tundzai001_land_slide_web
            -Dsonar.qualitygate.wait=true

  release-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, sonar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package verified source and assets
        run: >-
          git archive --format=tar.gz --output=monitoring-release.tar.gz HEAD
          frontend/dist backend/app backend/alembic backend/alembic.ini
          backend/processors backend/static backend/requirements.txt
          backend/server.py backend/security_core.py field_unit web.config
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-release-${{ github.sha }}
          path: monitoring-release.tar.gz
          retention-days: 14
