[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-network-adjustment"
version = "1.0.0"
description = "Weighted least-squares adjustment for 3D GNSS baseline networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.scripts]
gnss-adjust = "gnss_adjustment.cli:main"

[tool.setuptools.packages.find]
include = ["gnss_adjustment*"]
